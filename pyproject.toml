[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-manything"
version = "0.1.0"
description = "Retrieval, prompt, and answer components for the RAG-manything project"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1", "openai>=1.109,<3", "pydantic>=2.8,<3",
  "pydantic-settings>=2.6,<3", "langsmith>=0.3.45,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "fastapi>=0.115,<1"]
evaluation = ["ragas>=0.4.3,<0.5", "langchain-openai>=0.3.30,<2"]
retrieval = ["qdrant-client>=1.12,<2", "FlagEmbedding>=1.3,<2"]

[project.scripts]
rag-answer = "rag_manything.cli:main"
rag-evaluate = "rag_manything.evaluation.ragas_eval:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
